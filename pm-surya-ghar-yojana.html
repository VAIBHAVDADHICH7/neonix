        <section style="margin-top: 1.5rem;">
          <h3>Overview of PM Surya Ghar Muft Bijli Yojana</h3>
          <p>Launched by the Prime Minister of India, the PM Surya Ghar Muft Bijli Yojana is the country's flagship clean energy initiative aiming to illuminate 1 crore households with rooftop solar power systems. Under this landmark scheme, residential consumers receive direct central financial assistance (Direct Benefit Transfer - DBT) deposited straight into their bank account to offset solar panel installation costs and provide up to 300 units of free electricity every month.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>Government Subsidy Slabs &amp; Financial Breakdown</h3>
          <p>The central DBT financial assistance is structured based on solar plant capacity:</p>
          <ul>
            <li><strong>1 kW Rooftop Solar System:</strong> ₹30,000 direct central subsidy.</li>
            <li><strong>2 kW Rooftop Solar System:</strong> ₹60,000 direct central subsidy.</li>
            <li><strong>3 kW to 10 kW Rooftop Solar System:</strong> ₹78,000 flat maximum direct central subsidy.</li>
            <li><strong>Group Housing Societies (GHS) / Resident Welfare Associations (RWA):</strong> ₹18,000 per kW for common area lighting and EV charging up to 500 kW.</li>
          </ul>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>Step-by-Step Application &amp; Turnkey Approval Workflow</h3>
          <p>Neonix Infra Solutions acts as an empanelled solar EPC vendor facilitating your complete subsidy journey:</p>
          <ol>
            <li>National Portal Registration (pmsuryaghar.gov.in) with your DISCOM consumer number.</li>
            <li>Digital Technical Feasibility approval from your state DISCOM (e.g. JVVNL, AVVNL, JdVVNL).</li>
            <li>Installation of MNRE-compliant DCR solar panels and certified grid-tie inverters.</li>
            <li>Net meter inspection and commissioning certificate issuance.</li>
            <li>Automatic DBT credit of ₹78,000 into your Aadhaar-linked bank account within 30 days.</li>
          </ol>
        </section>

        <section style="margin-top: 1.5rem;">
