        <section style="margin-top: 1.5rem;">
          <h3>Slash Commercial Electricity Tariffs</h3>
          <p>Commercial properties in India pay some of the highest power tariffs, often ranging from ₹8 to ₹12 per kilowatt-hour (kWh). Neonix commercial rooftop solar solutions generate clean on-site electricity at a levelized cost of energy (LCOE) under ₹2.50 per unit, allowing corporate offices, retail showrooms, educational institutions, hotels, and healthcare centers to slash daytime utility expenses by up to 80%.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>40% Accelerated Depreciation Tax Benefit</h3>
          <p>Under Section 32 of the Indian Income Tax Act, businesses and commercial enterprises installing commercial solar power systems can claim 40% Accelerated Depreciation in the first year of operation. This tax shield significantly lowers corporate income tax liability, effectively reducing capital payback period down to 2.5 to 3.5 years.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>Advanced Solar-Diesel Generator (DG) Synchronization</h3>
          <p>Frequent power cuts force commercial establishments to rely on expensive diesel generators costing ₹25 to ₹30 per unit. Neonix integrates smart DG-Solar synchronization controllers that dynamically match solar generation with generator load, preventing reverse power flow into diesel generators while cutting diesel fuel consumption by up to 70%.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>End-to-End Turnkey Solar EPC &amp; Net Metering</h3>
          <p>From computerized 3D shadow analysis and structural load testing to DISCOM CEIG statutory approvals, high-tension (HT) / low-tension (LT) synchronization, and bi-directional net metering, Neonix delivers comprehensive turnkey execution with zero disruption to daily business operations.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>Monitoring &amp; Generation Guarantee</h3>
          <p>Every commercial solar installation includes cloud-based SCADA generation monitoring, automated alert triggers, and preventative maintenance support to ensure optimum performance ratio (PR) across the 25-year plant lifespan.</p>
        </section>
