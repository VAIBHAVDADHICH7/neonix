          <h1>Solar Care &amp; Annual Maintenance Contract (AMC) Services — Neonix Solar</h1>
          <p>Professional rooftop solar panel cleaning, drone thermal hotspot scanning, and preventative inverter servicing across India to recover up to 25% lost generation.</p>
        </header>

        <section style="margin-top: 1.5rem;">
          <h3>Why Professional Solar AMC is Critical</h3>
          <p>Dust, vehicle pollution, industrial smog, and bird droppings accumulate rapidly on photovoltaic modules, causing 'soiling losses' that degrade solar generation by 15% to 30%. Cleaning solar panels with hard tap water leaves calcified scaling and mineral deposits that permanently etch anti-reflective glass coatings. Neonix Solar Care delivers certified solar Operations &amp; Maintenance (O&amp;M) using demineralized reverse osmosis (RO) water and non-abrasive rotary brushes to maximize power yields.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>Thermal Drone Scanning &amp; Hotspot Detection</h3>
          <p>Micro-cracks, damaged bypass diodes, and localized shading cause cell hotspots that reach over 90°C, risking module delamination and electrical fires. Our preventative solar maintenance includes calibrated radiometric thermal drone inspections and high-resolution IR imaging to pinpoint defective cells and process warranty claims before failure occurs.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>18-Point Electrical &amp; Inverter Diagnostic Inspections</h3>
          <p>Every Neonix Solar AMC visit includes string open-circuit voltage (Voc) and short-circuit current (Isc) testing, MC4 connector thermal verification, cable insulation resistance testing, DC/AC surge protection device (SPD) and earthing pit resistance measurement (&lt; 2 Ohms), inverter heat sink cleaning, firmware upgrades, MPPT efficiency checks, structural mounting bolt torque auditing and anti-corrosion touch-ups.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>Guaranteed Generation &amp; Emergency Breakdown Support</h3>
          <p>We offer quarterly, bi-monthly, and monthly cleaning schedules tailored for residential villas, industrial roofs, and commercial solar parks, backed by guaranteed emergency technical dispatch within 24 to 48 hours.</p>
