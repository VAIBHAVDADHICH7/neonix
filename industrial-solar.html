          <h1>Industrial Solar Power Plants &amp; MW Scale Rooftop EPC — Neonix Solar</h1>
          <p>High-capacity rooftop and ground-mounted solar installations for factories, warehouses, manufacturing units, and textile mills across India.</p>

        <section style="margin-top: 1.5rem;">
          <h3>Heavy-Duty Industrial Solar EPC</h3>
          <p>Industrial manufacturing plants, cold storages, chemical facilities, and warehouses face massive electricity costs that directly impact operating profit margins. Neonix designs, procures, and constructs megawatt-scale (MW) industrial rooftop solar power plants engineered for high energy yields, thermal resilience, and rugged industrial environments.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>Non-Penetrating PEB Shed Mounting Structures</h3>
          <p>We specialize in non-penetrating Klip-lok and standing seam aluminum clamps for Pre-Engineered Building (PEB) metal roofs. Our structural designs protect roof warranties by avoiding screw perforations, ensuring zero water leakage while accommodating high thermal expansion and wind loads up to 170 km/h.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>Peak Demand Charge Shaving &amp; HT Grid Synchronization</h3>
          <p>Industrial consumers face hefty two-part tariff penalties based on maximum demand indicators (kVA). Neonix industrial solar power systems shave daytime peak demand peaks, lowering contracted demand charges. We handle complete 11kV / 33kV HT transformer stepping, vacuum circuit breakers (VCB), CEIG statutory electrical safety approvals, and net metering synchronization.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>Zero-Export Relays &amp; Power Quality Management</h3>
          <p>Where grid export permissions are constrained or pending, we deploy ultra-fast zero-export reverse power relays to modulate inverter output in milliseconds. Our systems feature active harmonic filtering and power factor (PF) maintenance to ensure compliance with stringent state grid codes.</p>
        </section>

        <section style="margin-top: 1.5rem;">
          <h3>CAPEX &amp; OPEX / RESCO Financing Models</h3>
          <p>Businesses can choose direct CAPEX ownership to maximize 40% accelerated depreciation tax savings and 28%+ equity IRR, or OPEX/PPA models with zero capital expenditure, purchasing solar power at a steep discount to grid tariffs.</p>
        </section>
